<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tally — Mahjong &amp; Football</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0f0f;
        --surface: #171717;
        --border: #2a2a2e;
        --text: #e5e7eb;
        --muted: #a1a1aa;
        --gold: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Noto Sans HK', sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: 0.02em;
      }
      h1 span {
        color: var(--gold);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 15px;
      }
      code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tally <span>— Mahjong &amp; Football</span></h1>
      <p>
        Phase A backend is running. The frontend (Phase B) will replace this placeholder.
        API health: <code>/api/health</code>
      </p>
    </main>
  </body>
</html>
